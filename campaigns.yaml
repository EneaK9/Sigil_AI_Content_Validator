# Sigil Scraper Campaigns - Albania Political Content
# Keywords: Protesta, Kushner, Trump, Edi Rama
# Location: Albania

campaigns:
  # TikTok campaign - compound story queries only
  - client: sigil
    platform: tiktok
    topic: albania_political
    country: AL
    seeds:
      - "Jared Kushner Albania protest"
      - "Kushner Sazan Albania"
      - "Trump Kushner Albania resort"
      - "Ivanka Trump Albania resort"
      - "Edi Rama Kushner Sazan"
      - "Albania protest Kushner resort"
      - "Sazan Island Kushner protest"
      - "Kushner Shqiperi protesta"
    daily_target: 1000
    enabled: true

  # Instagram campaign - hashtags/profiles only; relevance filter removes broad hits
  - client: sigil
    platform: instagram
    topic: albania_political
    country: AL
    seeds:
      - "#jaredkushner"
      - "#kushner"
      - "#ivankatrump"
      - "#sazan"
      - "#edirama"
      - "#protesta"
      - "https://www.instagram.com/topchannelalb/"
      - "https://www.instagram.com/tvklan.al/"
      - "https://www.instagram.com/a2cnn/"
      - "https://www.instagram.com/euronews.al/"
    daily_target: 1000
    enabled: true

  # Facebook campaign - broad keyword query for F60Kx7YJNOmKmqQm3
  - client: sigil
    platform: facebook
    topic: albania_political
    country: AL
    seeds:
      - "protesta"
      - "albania"
      - "shqiperia"
      - "kushner"
      - "trump"
      - "edi rama"
      - "izrael"
    daily_target: 1000
    enabled: true

  # Twitter/X campaign - broader query terms (to avoid 0-result runs)
  - client: sigil
    platform: twitter
    topic: albania_political
    country: AL
    seeds:
      - "albania"
      - "edi rama"
      - "kushner"
      - "kushner albania"
      - "sazan"
      - "sazan kushner"
      - "ivanka"
      - "trump"
      - "albania protest"
      - "protesta shqiperi"
    daily_target: 1000
    enabled: true

  # LinkedIn campaign - compound story queries
  - client: sigil
    platform: linkedin
    topic: albania_political
    country: AL
    seeds:
      - "Jared Kushner Albania"
      - "Kushner Sazan resort"
      - "Albania protest Kushner"
      - "Edi Rama Kushner"
      - "Trump Albania investment"
    daily_target: 500
    enabled: true

  # Reddit campaign - r/albania plus search terms
  - client: sigil
    platform: reddit
    topic: albania_political
    country: AL
    seeds:
      - "rama, protests, kushner, trump, israel, albania"
    daily_target: 100
    enabled: true

