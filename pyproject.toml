[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil"
version = "1.0.0"
description = "Scrape -> validate -> flag social posts against platform policy (Apify + LLM + Supabase)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sigil" }]
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "yt-dlp",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "apify-client==1.12.1",
    "asyncpg==0.30.0",
    "sqlalchemy[asyncio]==2.0.36",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "responses>=0.24.0",
]

[project.scripts]
sigil = "sigil.cli:main"
sigil-scheduler = "sigil.scraper.orchestration.scheduler:main"
sigil-validator = "sigil.scraper.orchestration.scheduler:validator_main"
sigil-migrate = "sigil.migrate:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sigil.validation" = ["policies/*.md"]
"sigil.scraper.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "live: marks tests that require live API calls (deselect with '-m \"not live\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
